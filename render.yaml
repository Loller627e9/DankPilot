services:
  - type: web
    name: dank-farm
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Free instances sleep without traffic; the self-ping keeps it awake.
      - key: SELF_PING_MS
        value: "240000"
      - key: DATA_DIR
        value: storage
      - key: COMMAND_INTERVAL
        value: "3000"
      - key: CYCLE_INTERVAL
        value: "45000"
      # Set these in the Render dashboard (sync: false keeps them out of git).
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      # token:channelId pairs. Render's free plan has no persistent disk, so the
      # data directory is wiped on redeploy — this is what re-registers the
      # accounts so farming resumes by itself.
      - key: FARM_ACCOUNTS
        sync: false
