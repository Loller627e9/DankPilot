[project]
name = "dankfarm"
version = "3.0.0"
description = "Multi-account Dank Memer automation panel"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Broad excepts are deliberate: the bot must survive a bad reply or a dropped
# socket without taking the process down.
ignore = ["BLE001"]
